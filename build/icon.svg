<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2d2b"/>
      <stop offset="1" stop-color="#171716"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97757"/>
      <stop offset="1" stop-color="#f0a080"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824 px body centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="4">
    <line x1="220" y1="380" x2="804" y2="380"/>
    <line x1="220" y1="512" x2="804" y2="512"/>
    <line x1="220" y1="644" x2="804" y2="644"/>
  </g>
  <!-- a step-line trace -->
  <path d="M220 700 H300 V620 H372 V668 H448 V540 H520 V584 H592 V430 H664 V470 H730 V330 H804"
        fill="none" stroke="url(#trace)" stroke-width="44" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="804" cy="330" r="38" fill="#ecebe8"/>
</svg>
